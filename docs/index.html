<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edzésnapló</title>
<meta name="theme-color" content="#44587a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edzésnapló">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f2f1ee;--bg2:#e6e8ee;--card:rgba(255,255,255,.72);--solid:#fff;--ink:#1b1e25;--mute:#878c96;--line:rgba(24,30,48,.08);
  --acc:#4a5d8f;--acc2:#7486ba;--soft:rgba(74,93,143,.10);--del:#d0584a;
  --grad:linear-gradient(135deg,#2f3b60 0%,#4f639a 48%,#9aa7c8 100%);
  --shadow:0 1px 2px rgba(20,25,40,.04),0 8px 24px -8px rgba(20,25,40,.14);
  --r:22px;--blur:saturate(180%) blur(18px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f14;--bg2:#161a24;--card:rgba(30,34,44,.72);--solid:#1d212b;--ink:#eef0f5;--mute:#9399a6;--line:rgba(255,255,255,.07);
  --acc:#93a6dd;--acc2:#b6c3ea;--soft:rgba(147,166,221,.14);--shadow:0 10px 30px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
[hidden]{display:none!important}#exform.logm .nolog{display:none}
.logsearch{margin:4px 0 6px}.logsearch input{width:100%}
.detbtn{margin-top:8px}
.det{margin-top:8px;overflow-x:auto}.det table{width:100%;border-collapse:collapse;font-size:12px}
.det th{text-align:left;color:var(--mute);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.det td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.det td:nth-child(2){white-space:normal}.det tr.newex td{border-top:2px solid var(--line)}
.det .over{color:var(--warn,#c0392b)}
.musc .mg{display:grid;grid-template-columns:96px 1fr 26px 22px;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.musc .bar{position:relative;height:10px;border-radius:6px;background:var(--line)}
.musc .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--acc) 45%,transparent)}
.musc .bar i.ok{background:var(--acc)}
.musc .bar em{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mute);opacity:.6}
.musc .mg b{text-align:right}.musc .mg small{color:var(--mute);text-align:right}
.stall ul{margin:8px 0;padding-left:18px}
.rstat{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.5}
html,body{margin:0;color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 100% 0%,var(--bg2) 0%,transparent 60%),radial-gradient(80% 50% at 0% 100%,var(--bg2) 0%,transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#hdr{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;max-width:640px;margin:0 auto}
.date{color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h1{margin:2px 0 12px;font-size:32px;line-height:1.1;letter-spacing:-.03em;font-weight:800}
h2{margin:6px 2px 4px;font-size:22px;letter-spacing:-.02em}
.seg2{position:relative;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg2 button{flex:1 0 auto;min-width:56px;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;color:var(--mute);transition:all .25s}
.seg2 button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(47,59,96,.6)}
main{padding:8px 14px calc(150px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sub{color:var(--mute);margin:0 2px 12px;font-size:14px}
.card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;color:#fff;background:var(--grad);box-shadow:0 18px 40px -18px rgba(47,59,96,.75);margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .hd{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.hero h2{margin:0;font-size:26px;color:#fff}
.hero .hs{opacity:.8;font-size:14px;margin-top:2px}
.hero .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1;font-size:13px;opacity:.9}
.hero .stats b{display:block;font-size:20px;opacity:1;font-variant-numeric:tabular-nums}
.ring{flex:0 0 auto;width:68px;height:68px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.hbtn{position:relative;z-index:1;margin-top:16px;width:100%;border:0;border-radius:16px;padding:13px;font-weight:800;background:rgba(255,255,255,.95);color:#2f3b60}
.edit{float:right;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--acc)}
.ex{animation:rise .35s both;scroll-margin-top:calc(12px + env(safe-area-inset-top))}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.ex.done{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.ex.going{background:color-mix(in srgb,#3fb96b 13%,var(--solid));border-color:color-mix(in srgb,#3fb96b 45%,transparent)}
.ex.muted{background:color-mix(in srgb,var(--card) 55%,transparent);box-shadow:none;border-color:var(--line)}
.ex.muted .thumb{filter:grayscale(1) opacity(.55);width:46px;height:46px;border-radius:13px}
.ex.muted h3{color:var(--mute);font-weight:600}
.ex.muted .chips span,.ex.muted .chips button{opacity:.6}
.ex.folded{padding:10px 14px}
.ex.folded .chips,.ex.folded .note{display:none}
.ex.folded .thumb i{display:none}
.foldbar{display:block;width:100%;margin-top:8px;border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:700;text-align:left;padding:2px 0}
.exhead{display:flex;gap:12px;align-items:center}
.thumb{flex:0 0 auto;width:62px;height:62px;border-radius:16px;border:0;background:var(--grad) center/cover no-repeat;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.45))}
.thumb i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.thumb i svg{width:12px;height:12px;fill:#2f3b60;margin-left:2px}
.thumb.q i svg{margin:0}
.ex.done .thumb::after{content:"✓";position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--acc);font-size:12px;font-weight:900;display:grid;place-items:center}
.exinfo{flex:1;min-width:0}
.exinfo h3{margin:0;font-size:16.5px;line-height:1.25;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.exinfo .mus{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:1px}
.chips span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--acc)}
.chips span.up{background:var(--grad);color:#fff}
.uchip{flex:0 0 auto;align-self:flex-start;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--solid);color:var(--mute);border-radius:9px;padding:4px 8px}
.note{font-size:13px;color:var(--mute);margin-top:10px;padding-left:10px;border-left:3px solid var(--soft)}
.dots{display:flex;gap:4px;margin:12px 0 4px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--grad)}
.dots i.wu{flex:.5}
.sets{display:grid;gap:7px;margin-top:8px}
.sw{position:relative;border-radius:14px;overflow:hidden}
.sw::before{opacity:0;transition:opacity .15s;content:"Törlés";position:absolute;inset:0;background:var(--del);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;border-radius:14px}
.sw.swiping::before{opacity:1}
.set{position:relative;display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:7px;align-items:center;background:var(--solid);border-radius:14px;padding:4px;touch-action:pan-y;transition:transform .2s}
.set .n{font-size:13px;font-weight:800;color:var(--mute);text-align:center}
.set label{position:relative}
.set input{width:100%;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;padding:9px 34px 9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .2s}
.set input:focus{border-color:var(--acc)}
.set label span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--mute);pointer-events:none}
.ok{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);justify-self:end}
.ok svg{width:18px;height:18px;stroke:var(--mute);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.set.d .ok{background:var(--grad);border-color:transparent;transform:scale(1.04)}
.set.d .ok svg{stroke:#fff}
.set.d input{background:var(--soft);border-color:transparent}
.set.wu .n{color:var(--acc)}
.set.wu input{border-style:dashed}
.addset{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.addset button{font-size:13px;font-weight:700;border:1px dashed color-mix(in srgb,var(--acc) 40%,transparent);background:transparent;color:var(--acc);border-radius:10px;padding:6px 11px}
.addset button.m{color:var(--mute);border-color:var(--line)}
.addset button[data-act=skip]{margin-left:auto}
.btn{font-weight:700;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink);padding:11px 16px}
.btn.p{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px rgba(47,59,96,.7)}
.btn.w{color:var(--del)}
.btn.s{padding:7px 11px;font-size:14px;border-radius:11px}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.tools{display:flex;gap:6px;margin-top:12px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:4px 0 14px}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:0 12px 32px -10px rgba(20,25,40,.35)}
#dock button{border:0;background:transparent;width:70px;padding:7px 0 5px;border-radius:18px;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mute);transition:all .2s}
#dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dock button.on{color:var(--acc);background:var(--soft)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;background:rgba(22,26,36,.88);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:#fff;box-shadow:0 20px 40px -14px rgba(0,0,0,.5);animation:rise .3s both}
#rest[hidden]{display:none}
#rest .rr{position:relative;width:56px;height:56px;flex:0 0 auto}
#rest .rr svg{transform:rotate(-90deg)}
#rest .lbl{flex:1}
#rest .lbl small{display:block;font-size:12px;opacity:.65;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
#rest .lbl small.pace{text-transform:none;letter-spacing:0;opacity:.85;font-size:12.5px;margin-top:2px}
#rest .lbl small.pace b{font-weight:800}
#rest .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest button{border:0;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800}
#rest.end{background:var(--grad);animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03)}}
dialog{border:0;border-radius:26px;padding:20px;width:min(94vw,460px);background:var(--solid);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,12,18,.5);backdrop-filter:blur(6px)}
#exdlg{max-height:88vh;overflow-y:auto}
#viddlg{padding:0;overflow:hidden;width:min(92vw,400px);background:#000}
#viddlg iframe{display:block;width:100%;aspect-ratio:9/16;max-height:74vh;border:0}
#viddlg .vb{display:flex;gap:8px;padding:10px;background:var(--solid)}
.f{display:grid;gap:11px}
.f label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.f input[type=text],.f input[type=number],.f input[type=url],.f input[type=email],.f input[type=password],select{font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.f .ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log .h{display:flex;gap:8px;align-items:center}
.log .h b{flex:1}
.log ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.log li{margin:2px 0}
.log li span{color:var(--mute)}
.meta{color:var(--mute);font-size:14px}
svg text{font-size:11px;fill:var(--mute)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mute);text-align:center;padding:40px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--solid);padding:8px 16px}
.seg button.on{background:var(--grad);color:#fff}
.restgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.restgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 0;font-weight:800}
.restgrid button.on{background:var(--grad);color:#fff;border-color:transparent}
button.chip{border:0;font:inherit;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--acc)}
.libcats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.libcats button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.libcats button.on{background:var(--grad);color:#fff;border-color:transparent}
.libres{max-height:34vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.libres button{display:flex;width:100%;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px;text-align:left;font-size:15px}
.libres button:last-child{border-bottom:0}
.libres button span{margin-left:auto;font-size:11px;font-weight:800;color:var(--acc);background:var(--soft);border-radius:6px;padding:2px 7px}
.libres button.on{background:var(--soft)}
.libres .none{padding:12px;color:var(--mute);font-size:14px}
.err{color:var(--del);font-size:14px;min-height:1em}
#done{text-align:center;overflow:visible}
#done h2{font-size:28px;margin:8px 0 4px}
#done .big3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}
#done .big3 div{background:var(--soft);border-radius:16px;padding:12px 4px;font-size:12px;color:var(--mute);font-weight:700}
#done .big3 b{display:block;font-size:22px;color:var(--ink)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
h1.pass{cursor:pointer}
h1.pass.warn{color:#c9653a}
h1.pass.exp{color:var(--del)}
.who{float:right;margin-top:2px;min-width:38px;height:38px;border-radius:999px;border:0;background:var(--grad);color:#fff;font-weight:800;padding:0 12px}
.who.out{background:var(--card);color:var(--acc);border:1px solid var(--line);font-size:13px}
.prev{font-size:12.5px;color:var(--mute);margin-top:10px;padding:7px 10px;border-radius:10px;background:var(--soft)}
.prev b{color:var(--ink);font-variant-numeric:tabular-nums}
.chips button.swap{border:0;font:inherit;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:transparent;color:var(--mute);border:1px dashed var(--line)}
.chips span.alt{background:var(--grad);color:#fff}
.sugg{position:relative;z-index:1;display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px;margin-bottom:10px}
.weeks .wgrid{display:grid;gap:5px;margin-top:12px}
.weeks .wk{display:grid;grid-template-columns:44px repeat(7,1fr);gap:5px;align-items:center}
.weeks .wk span{font-size:11px;color:var(--mute);font-weight:700}
.weeks .wk b{font-size:11px;color:var(--mute);text-align:center}
.weeks .wk i{height:16px;border-radius:5px;background:var(--line)}
.weeks .wk i.on{background:var(--grad)}
.weeks .wk i.fut{opacity:.35}
.weeks .wk.met span{color:var(--acc)}
.prs{margin:6px 0 0;padding:0;list-style:none;font-size:13px}
.prs li{margin-top:4px}
#done .prs{text-align:left;background:var(--soft);border-radius:16px;padding:12px 14px;margin:0 0 16px}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<nav id="dock"></nav>

<div id="rest" hidden>
  <div class="rr"><svg viewBox="0 0 56 56" width="56" height="56"><circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,.18)" stroke-width="5" fill="none"/><circle id="rest-ring" cx="28" cy="28" r="24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg></div>
  <div class="lbl"><small id="rest-l">Pihenő</small><div class="t" id="rest-t">1:30</div><small id="rest-p" class="pace"></small></div>
  <button id="rest-plus">+15</button>
  <button id="rest-x">✕</button>
</div>
<div id="toast"></div>

<dialog id="viddlg">
  <iframe id="vidframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Videó"></iframe>
  <div class="vb"><a class="btn s" id="vidyt" target="_blank" rel="noopener">Megnyitás a YouTube-ban</a><span class="grow"></span><button class="btn s p" id="vidx">Bezárás</button></div>
</dialog>

<dialog id="done"></dialog>
<dialog id="swapdlg"></dialog>

<dialog id="restdlg">
  <b id="restdlg-t">Pihenőidő</b>
  <div class="restgrid" id="restgrid"></div>
  <div class="row" style="margin-top:12px"><input type="number" id="restcustom" inputmode="numeric" placeholder="saját (mp)" style="flex:1;font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)"><button class="btn p" id="restok">OK</button></div>
  <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn s" id="restx">Mégse</button></div>
</dialog>

<dialog id="exdlg">
  <form class="f" id="exform" method="dialog">
    <b id="exdlg-title">Gyakorlat</b>
    <div id="libpick" class="f">
      <input type="search" id="libq" placeholder="🔍 Keresés: írd be a gyakorlat nevét…" autocomplete="off" autocapitalize="off">
      <div class="libcats" id="libcats"></div>
      <div class="libres" id="libres"></div>
    </div>

// a hangjelzés a háttérzenével keveredjen (YouTube Music, Spotify), ne állítsa meg

function beep() {
  if (S.settings.sound === false) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    [0, 0.25, 0.5].forEach((d) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d + 0.2);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.21);

    // utána elengedjük a hangot, hogy ne tartsa foglalva a lejátszást
    const a = audio; audio = null; setTimeout(() => { try { a.close(); } catch (e) {} }, 1200);
  } catch (e) {}
}
// az aktív edzés eddigi kalóriája a pihenő-sávba
// tempó: hány % kész a sorozatokból, és hány % telt el a tervezett időből
function planMin(day) {
  if (day.min) return +day.min;
  let sec = 0; // becslés: sorozatonként ~45 mp munka + a pihenő, gyakorlatonként ~1 perc átállás
  for (const ex of day.ex) sec += ex.sets * 45 + Math.max(0, ex.sets - 1) * (ex.rest == null ? S.settings.rest : ex.rest) + 60;
  return Math.max(10, Math.round(sec / 60));
}
function paceTxt() {
  const d = S.plan.days.find((x) => started(S.cur[x.id])); if (!d) return '';
  const c = S.cur[d.id], pr = dayProgress(d), full = dayProgress(d, true).all, target = Math.max(5, Math.round(planMin(d) * (full ? pr.all / full : 1)));
  const el = (Date.now() - c.t0) / 60000, tp = Math.min(1, el / target);
  const done = Math.round(pr.pct * 100), tpc = Math.round(tp * 100);
  const lag = Math.round((tp - pr.pct) * target);
  const st = pr.pct >= 1 ? '✓ minden kész' : lag <= 2 ? (lag < -5 ? `⚡ ${-lag} perccel előrébb` : '✓ jó tempó') : `⚠ ~${lag} perc csúszás`;
  let fin = '';
  if (pr.pct > 0.05 && pr.pct < 1) { const t = new Date(c.t0 + el / pr.pct * 60000); fin = ` · vége ~${t.toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' })}`; }
  return `<b>${done}%</b> kész · idő ${tpc}% (${target} percből) · <b>${st}</b>${fin}`;
}
// az aktív edzés eddig megmozgatott súlya (súly × ismétlés, bemelegítés nélkül), mindig kg-ban
function liveVol(day) {
  const c = S.cur[day.id]; if (!started(c)) return 0;
  let vol = 0;
  for (const ex of dayEx(day)) {
    if (isBW(ex)) continue;
    for (const z of c.sets[ex.id] || []) if (z && z.d && !z.wu) vol += (z.w || 0) * (z.r || 0) * (ex.pair || ex.side ? 2 : 1);
  }
  return Math.round(vol);
}
function restKcal() {
  const d = S.plan.days.find((x) => started(S.cur[x.id])); if (!d) return '';
  const vol = liveVol(d), v = liveKcal(d);
  return (vol ? ' · 🏋 ' + vol.toLocaleString('hu-HU') + ' kg' : '') + (v != null ? ' · 🔥 ~' + v + ' · nettó ~' + liveNet(d) + ' kcal' : '');
}
function startRest(sec) {
  if (!sec) return;
  restLen = sec; restEnd = Date.now() + sec * 1000;
  $('rest').hidden = false; $('rest').classList.remove('end');
  clearInterval(restTick); restTick = setInterval(tickRest, 250); tickRest();
}
function tickRest() {
  const left = (restEnd - Date.now()) / 1000;
  if (left <= 0) {
    clearInterval(restTick);
    $('rest-t').textContent = 'Mehet!'; $('rest-l').textContent = 'Kész a pihenő' + restKcal(); $('rest-p').innerHTML = paceTxt(); $('rest-ring').style.strokeDashoffset = 0; $('rest').classList.add('end');
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    beep();
    setTimeout(() => { if (restEnd <= Date.now()) $('rest').hidden = true; }, 4000);
    return;
  }
  $('rest-t').textContent = mmss(Math.ceil(left));
  $('rest-l').textContent = 'Pihenő' + restKcal(); $('rest-p').innerHTML = paceTxt(); $('rest-ring').style.strokeDashoffset = (150.8 * (1 - left / restLen)).toFixed(1);

$('rest-plus').onclick = () => { restEnd += 15000; restLen += 15; if ($('rest').classList.contains('end')) startRest(15); };

// képernyő ébren tartása edzés közben
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) {}
}

// ---------- folyamatban lévő edzés ----------
// sorozatok: előbb a bemelegítők (wu), aztán a munkasorozatok; x = edzés közben hozzáadott
const workW = (ex) => isBW(ex) ? (S.settings.bw == null ? null : S.settings.bw) : ex.w;
const wuW = (ex) => isBW(ex) ? workW(ex) : (ex.w == null ? null : Math.round(ex.w) / 2);
function baseSets(ex) {
  const a = [];
  for (let i = 0; i < (ex.wu || 0); i++) a.push({ d: 0, wu: 1, w: wuW(ex), r: null });
  for (let i = 0; i < ex.sets; i++) a.push({ d: 0, w: workW(ex), r: null });
  return a;
}
function setRows(day, ex) {
  const c = S.cur[day.id], arr = c && c.sets[ex.id];
  const base = baseSets(ex);
  if (!arr) return base;
  if (c.fixed && c.fixed[ex.id]) return arr.map((x, i) => x || base[i] || { d: 0, w: workW(ex), r: null });
  const n = Math.max(arr.length, base.length), out = [];
  for (let i = 0; i < n; i++) out.push(arr[i] || base[i] || { d: 0, w: workW(ex), r: null });
  return out;
}
function curArr(day, ex) {
  let c = S.cur[day.id];
  if (!c) c = S.cur[day.id] = { sets: {} };
  const rows = setRows(day, ex);
  c.sets[ex.id] = rows;
  (c.fixed || (c.fixed = {}))[ex.id] = 1;
  return rows;
}
// az edzés akkor indul, ha megnyomod az „Edzés indítása” gombot, vagy kipipálod az első sorozatot
const anyDone = (c) => !!c && Object.values(c.sets || {}).some((a) => (a || []).some((x) => x && x.d));
const started = (c) => !!c && !!c.t0 && (!!c.go || anyDone(c));
function startCur(day) { const c = S.cur[day.id] || (S.cur[day.id] = { sets: {} }); if (!started(c)) { c.t0 = Date.now(); c.go = 1; } return c; }

// sorrend tanulása: az utolsó 3 edzés tényleges sorrendjének átlaga alapján
function learnOrder(day) {
  const recent = S.sessions.filter((x) => x.day === day.id && x.order && x.order.length > 1).slice(0, 3);
  if (!recent.length) return false;
  const n = day.ex.length, score = {}, seenIds = new Set();
  day.ex.forEach((ex, i) => {
    const fr = [];
    // a legutóbbi edzés számít a legjobban (3 : 2 : 1 súlyozás)
    recent.forEach((r, k) => { const p = r.order.indexOf(ex.id); if (p >= 0) fr.push([p / (r.order.length - 1), 3 - k]); });
    if (fr.length) { seenIds.add(ex.id); score[ex.id] = fr.reduce((a, [f, w]) => a + f * w, 0) / fr.reduce((a, [, w]) => a + w, 0); }
  });
  const before = day.ex.map((x) => x.id).join();
  const idx = new Map(day.ex.map((x, i) => [x.id, i]));
  // a ténylegesen elvégzett gyakorlatok az átlagos sorrendjük szerint…
  const seen = day.ex.filter((x) => seenIds.has(x.id)).sort((a, b) => (score[a.id] - score[b.id]) || (idx.get(a.id) - idx.get(b.id)));
  // …a kimaradtak pedig a tervbeli előzőjük után maradnak
  const out = seen.slice();
  day.ex.forEach((x, i) => {
    if (seenIds.has(x.id)) return;
    let k = -1; for (let j = i - 1; j >= 0 && k < 0; j--) k = out.indexOf(day.ex[j]);
    out.splice(k + 1, 0, x);

}
// emelés mértéke: font esetén 5/10 font, kg-nál 1 / 2,5 / 5 kg
function incFor(ex, w) {

}
function finishDay(day) {
  const c = S.cur[day.id];

    const all = (c.sets[ex.id] || []).filter((s) => s && s.d).map((s) => Object.assign(s.wu ? { w: s.w, r: s.r, wu: 1 } : { w: s.w, r: s.r }, s.t ? { t: s.t } : {}));
    if (!all.length) continue;
    if (ex.assist) for (const z of all) { z.a = z.w || 0; z.w = S.settings.bw ? Math.max(0, S.settings.bw - z.a) : null; }
    items.push(Object.assign({ ex: ex.id, name: ex.name, pair: !!ex.pair, side: !!ex.side, bw: isBW(ex), u: exU(ex), rest: ex.rest == null ? S.settings.rest : ex.rest, sets: all }, ex.assist ? { assist: 1 } : {}, ex.alt ? { alt: ex.alt } : {}));

    const [, max] = range(ex.reps);

    // ha egyik sem, akkor a legtöbbször használt súly (egy-egy próba-sorozat nem viszi el)

}

// ---------- előzmények, rekordok ----------
function lastOf(id, before) {
  for (const s of S.sessions) { if (before && s.date >= before) continue; const it = s.items.find((z) => z.ex === id); if (it) return { s, it }; }
  return null;
}
const e1rm = (w, r) => (w || 0) * (1 + (r || 0) / 30);
function bestOf(id, before) {
  const b = { w: 0, r: 0, e: 0 };
  for (const s of S.sessions) {
    if (before && s.date >= before) continue;
    const it = s.items.find((z) => z.ex === id); if (!it) continue;
    for (const z of it.sets) if (!z.wu) { b.w = Math.max(b.w, z.w || 0); b.r = Math.max(b.r, z.r || 0); b.e = Math.max(b.e, e1rm(z.w, z.r)); }
  }
  return b;
}
function findPRs(sess) {
  const out = [];

    const work = it.sets.filter((z) => !z.wu); if (!work.length) continue;
    const prev = bestOf(it.ex, sess.date); if (!prev.r) continue; // első alkalom nem rekord
    const pe = exById(it.ex), u = pe ? exU(pe) : (it.u || unit());
    if (it.bw) { const r = Math.max(...work.map((z) => z.r || 0)); if (r > prev.r) out.push({ name: it.name, txt: r + ' ismétlés' }); continue; }
    const w = Math.max(...work.map((z) => z.w || 0)), e = Math.max(...work.map((z) => e1rm(z.w, z.r)));
    if (w > prev.w) out.push({ name: it.name, txt: toU(w, u) + ' ' + u });
    else if (e > prev.e + 0.01) out.push({ name: it.name, txt: 'becsült max. ' + Math.round(toU(e, u)) + ' ' + u });
  }
  return out;
}

  return `<div class="prev">↺ Legutóbb (${esc(new Date(p.s.date).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' }))}): <b>${esc(sets)}</b>${p.it.bw ? ' ism.' : ''}</div>`;
}

function suggestDay() {
  const days = S.plan.days.filter((d) => !d.extra); if (!days.length) return null;
  const busy = S.plan.days.find((d) => S.cur[d.id] && Object.values(S.cur[d.id].sets || {}).some((a) => (a || []).some((x) => x && x.d)));
  if (busy) return busy.id;
  const last = S.sessions.find((s) => days.some((d) => d.id === s.day));
  if (!last) return days[0].id;
  const i = days.findIndex((d) => d.id === last.day);
  return days[(i + 1) % days.length].id;
}

// ---------- heti áttekintés ----------
const weekStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
function weekCard(X) {
  const goal = S.settings.goal || 3, W = 7 * 86400000, now = weekStart(Date.now());
  const cnt = {}; const daysOn = new Set();
  let wk = 0, wkn = 0;
  for (const s of X.sessions) { const w = weekStart(s.date); cnt[w] = (cnt[w] || 0) + 1; if (w === now) { wk += kcalOf(s, !X.ro) || 0; wkn += netOf(s, !X.ro) || 0; } const d = new Date(s.date); d.setHours(0, 0, 0, 0); daysOn.add(d.getTime()); }
  let streak = 0; for (let w = now - ((cnt[now] || 0) >= goal ? 0 : W); (cnt[w] || 0) >= goal; w -= W) streak++;
  const weeks = []; for (let k = 7; k >= 0; k--) weeks.push(now - k * W);
  const grid = weeks.map((w) => `<div class="wk${(cnt[w] || 0) >= goal ? ' met' : ''}"><span>${new Date(w).toLocaleDateString('hu-HU', { month: 'numeric', day: 'numeric' })}</span>${[0, 1, 2, 3, 4, 5, 6].map((i) => `<i class="${daysOn.has(w + i * 86400000) ? 'on' : ''}${w + i * 86400000 > Date.now() ? ' fut' : ''}"></i>`).join('')}</div>`).join('');
  return `<div class="card weeks"><div class="row"><div class="grow"><b>Ezen a héten: ${cnt[now] || 0}/${goal} edzés${wk ? ' · ' + kcalTxt(wk, wkn || null) : ''}</b><div class="meta">${streak ? '🔥 ' + streak + ' hete egyhuzamban teljesítve' : 'Heti cél: ' + goal + ' edzés'}</div></div></div>
    <div class="wgrid"><div class="wk h"><span></span>${['H', 'K', 'Sz', 'Cs', 'P', 'Sz', 'V'].map((x) => `<b>${x}</b>`).join('')}</div>${grid}</div></div>`;
}

function genDemo() {
  const days = PLANS.monika.plan.days, N = 12, now = Date.now(), DAY = 86400000;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const step = (ex) => (ex.pair || ex.side) ? 1 : 2.5;
  const roundTo = (v, st) => Math.max(st, Math.round(v / st) * st);
  for (let k = 0; k < N; k++) {
    const day = days[k % days.length], f = 0.85 + 0.15 * k / (N - 1);
    const d0 = new Date(now - Math.round((N - 1 - k) * 2.3 + 1) * DAY); d0.setHours(rnd(16, 19), rnd(0, 59), 0, 0);
    const date = d0.getTime(), dur = rnd(48, 72) * 60000;
    const items = day.ex.map((ex) => {
      const [mn, mx] = range(ex.reps), sets = [];
      const bw = isBW(ex), w = bw ? (S.settings.bw || 62) : roundTo(ex.w * f, step(ex));
      for (let i = 0; i < (ex.wu || 0); i++) sets.push({ w: bw ? w : roundTo(w / 2, step(ex)), r: 12, wu: 1 });
      for (let i = 0; i < ex.sets; i++) sets.push({ w, r: Math.max(1, rnd(mn, mx) + (bw ? Math.floor(k / 4) : 0) - (i === ex.sets - 1 ? rnd(0, 1) : 0)) });
      return { ex: ex.id, name: ex.name, pair: !!ex.pair, side: !!ex.side, bw, u: 'kg', sets };
    });
    const sess = { id: 'demo-' + newId(), demo: true, date: date + dur, t0: date, day: day.id, dayName: day.name, items };
    S.sessions.push(sess);
    if (Gym.cloud) Gym.cloud.addSession(clone(sess)).catch(console.warn);
  }
  S.sessions.sort((a, b) => b.date - a.date);
  return N;
}

function bindSwipe() {
  document.querySelectorAll('.set').forEach((row) => {
    let x0 = null, y0 = 0, dx = 0, mode = null;
    row.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; });
    row.addEventListener('pointermove', (e) => {
      if (x0 == null) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) { if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { mode = 'x'; row.setPointerCapture(e.pointerId); row.style.transition = 'none'; row.parentNode.classList.add('swiping'); if (document.activeElement) document.activeElement.blur(); } else if (Math.abs(my) > 10) { x0 = null; return; } }
      if (mode === 'x') { dx = Math.min(0, mx); row.style.transform = `translateX(${dx}px)`; }
    });
    const end = () => {
      if (x0 == null) return; x0 = null;
      if (mode !== 'x') return;
      row.style.transition = '';
      if (dx >= -90) setTimeout(() => row.parentNode.classList.remove('swiping'), 200);
      if (dx < -90) { row.style.transform = 'translateX(-110%)'; if (navigator.vibrate) navigator.vibrate(15); setTimeout(() => delRow(row), 200); }
      else row.style.transform = '';
    };
    row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end);
  });
}

const HEAVY = /felhúzás|guggolás|lábtolás|hip thrust|csípőemelés/i;
function estKcal(sess, bw) {
  if (!bw || !sess.t0) return null;
  const min = Math.min(180, Math.max(1, (sess.date - sess.t0) / 60000));
  let work = 0, heavy = 0;
  for (const it of sess.items) for (const z of it.sets) if (!z.wu) { work++; if (HEAVY.test(it.name)) heavy++; }
  // alap ~3–3,5 MET (több gyakorlat, 8–15 ismétlés); minél több sorozat fér 10 percbe, annál intenzívebb;
  // a felhúzás/guggolás/lábtolás arányában +1,5 (5,0 MET)
  const per10 = work / min * 10;
  const met = Math.min(6, 3.0 + Math.min(1, 0.1 * per10) + (work ? 1.5 * heavy / work : 0));
  return Math.round(met * bw * min / 60);
}
// élő kalória az edzés közben: az eddig kipipált sorozatok és az eltelt idő alapján
function liveKcal(day) {
  const c = S.cur[day.id]; if (!started(c) || !S.settings.bw) return null;
  const items = dayEx(day).map((ex) => ({ name: ex.name, sets: (c.sets[ex.id] || []).filter((z) => z && z.d) })).filter((it) => it.sets.length);
  return estKcal({ t0: c.t0, date: Date.now(), items }, S.settings.bw);
}
const kcalOf = (s, own) => s.kcal != null ? s.kcal : (own ? estKcal(s, S.settings.bw) : null);
// nettó: az alapanyagcsere (1 MET = 1 kcal/kg/óra) nélkül, vagyis amit az edzés pluszban éget
const restBurn = (t0, t1, bw) => Math.round(bw * Math.min(180, Math.max(1, (t1 - t0) / 60000)) / 60);
function netOf(s, own) {
  if (s.kcalNet != null) return s.kcalNet;
  const tot = kcalOf(s, own); if (tot == null || !s.t0) return null;
  if (own && S.settings.bw) return Math.max(0, tot - restBurn(s.t0, s.date, S.settings.bw));
  return null;
}
function liveNet(day) {
  const v = liveKcal(day), c = S.cur[day.id]; if (v == null) return null;
  return Math.max(0, v - restBurn(c.t0, Date.now(), S.settings.bw));
}

  h += `<button class="btn" data-act="dnew" style="margin-top:10px">+ Új nap</button></div>`;
  h += `<div class="card"><b>Mentés</b><p class="meta">A terv és a napló letölthető fájlba, és onnan visszatölthető.</p>
    <div class="row"><button class="btn" data-act="export">Letöltés</button><label class="btn">Visszatöltés<input type="file" id="importfile" accept="application/json,.json" hidden></label></div></div>
    <div class="card f"><b>Verzió</b><p class="meta">${esc(APPVER)}</p><button class="btn" data-act="hardreload">Frissítés most</button></div>
    <div class="card f"><b>Teszt adatok</b><p class="meta">12 véletlenszerű, már befejezett edzést generál az elmúlt 4 hétre az A/B/C napok alapján, fokozatosan növekvő súlyokkal, hogy kipróbálhasd a naplót és a grafikont. Egy gombbal törölhetők, a valódi edzéseidhez nem nyúl.</p>
    <div class="row"><button class="btn" data-act="demo">Teszt edzések generálása</button>${S.sessions.some((x) => x.demo) ? '<button class="btn w" data-act="demodel">Teszt edzések törlése</button>' : ''}</div></div>
    <div class="card f"><b>Kész tervek</b><p class="meta">A kiválasztott terv lecseréli a mostanit. A napló megmarad.</p>
    <select id="tplsel">${Object.entries(PLANS).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join('')}</select>
    <button class="btn w" data-act="reset">Terv betöltése</button></div>`;
  return h;
}

// ---------- események ----------
document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab],button[data-nav],h1[data-nav]'); if (!b) return;
  if (b.dataset.tab) { S.tab = S.lastDay = b.dataset.tab; }
  else { const v = b.dataset.nav; S.tab = v === 'train' ? (dayById(S.lastDay) ? S.lastDay : (S.plan.days[0] || {}).id || 'set') : v; }
  editMode = false; save(false); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('main').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, day = dayById(S.tab);
  const card = b.closest('[data-ex]');
  const ex = card && day ? (editMode ? day.ex : dayEx(day)).find((x) => x.id === card.dataset.ex) : null;
  const i = +b.dataset.i;
  switch (act) {
    case 'edit': editMode = !editMode; render(); break;
    case 'tick': {
      const row = b.closest('.set'), si = +row.dataset.i;
      const s = curSet(day, ex, si);
      const wv = row.querySelector('.w').value, rv = row.querySelector('.r').value;
      s.w = fromU(wv, exU(ex)); s.r = rv === '' ? (s.wu ? 12 : range(ex.reps)[0]) : +rv;
      if (isBW(ex) && !s.wu) setBW(s.w);
      if (!s.d) {
        const c0 = startCur(day), oid = ex.alt || ex.id;
        (c0.order || (c0.order = [])).includes(oid) || c0.order.push(oid);
      }
      s.d = s.d ? 0 : 1; if (s.d) s.t = Date.now(); else delete s.t;
      if (navigator.vibrate) navigator.vibrate(12);
      save(); render();
      if (s.d) {
        const rr = ex.rest == null ? S.settings.rest : ex.rest; startRest(s.wu ? Math.min(rr, 60) : rr);
        // az oldal ugorjon a lista tetejére, ahol az éppen futó gyakorlat van
        const top = document.querySelector('article.ex');
        if (top) requestAnimationFrame(() => top.scrollIntoView({ block: 'start', behavior: 'smooth' }));
      }
      break;
    }
    case 'finish': finishDay(day); break;
    case 'addset': { const a = curArr(day, ex); const last = a.filter((x) => !x.wu).pop(); a.push({ d: 0, x: 1, w: last ? last.w : workW(ex), r: null }); save(); render(); break; }
    case 'addwu': { const a = curArr(day, ex); const k = a.filter((x) => x.wu).length; a.splice(k, 0, { d: 0, wu: 1, x: 1, w: wuW(ex), r: null }); save(); render(); break; }
    case 'delset': { const a = curArr(day, ex); let k = a.length - 1; while (k > 0 && a[k].d) k--; if (k >= 0) a.splice(k, 1); save(); render(); break; }
    case 'video': openVideo(ex); break;
    case 'restpick': openRest(ex); break;
    case 'unfold': openDone.add(ex.id); render(); break;
    case 'skip': { const c = S.cur[day.id] || (S.cur[day.id] = { sets: {} }); (c.skip || (c.skip = {}))[skipKey(ex)] = 1; save(); render(); toast('Ma kihagyva: ' + ex.name); } break;
    case 'unskip': { const c = S.cur[day.id]; if (c && c.skip) delete c.skip[skipKey(ex)]; save(); render(); } break;
    case 'refold': openDone.delete(ex.id); render(); break;
    case 'swap': openSwap(day, ex); break;
    case 'start': { startCur(day); save(); render(); toast('Indulhat! 💪'); break; }
    case 'discard': if (confirm('Elveted a mostani edzést? A kipipált sorozatok törlődnek.')) { delete S.cur[day.id]; save(); render(); } break;
    case 'up': case 'down': { const j = act === 'up' ? i - 1 : i + 1; [day.ex[i], day.ex[j]] = [day.ex[j], day.ex[i]]; save(); render(); break; }
    case 'exedit': openEx(day, i); break;
    case 'exnew': openEx(day, -1); break;
    case 'logadd': openLogAdd(b.dataset.id); break;
    case 'logdet': { const id = b.dataset.id; openDet.has(id) ? openDet.delete(id) : openDet.add(id); if ($('loglist') && LOGX) $('loglist').innerHTML = logList(LOGX); } break;
    case 'logdel': if (confirm('Törlöd ezt az edzést a naplóból?')) { S.sessions = S.sessions.filter((s) => s.id !== b.dataset.id); if (Gym.cloud) Gym.cloud.delSession(b.dataset.id).catch(console.warn); save(); render(); } break;
    case 'unit': S.settings.unit = b.dataset.u; save(); render(); break;
    case 'exunit': ex.unit = exU(ex) === 'lb' ? 'kg' : 'lb'; save(); render(); break;
    case 'dup': case 'ddown': { const d = S.plan.days, j = act === 'dup' ? i - 1 : i + 1; [d[i], d[j]] = [d[j], d[i]]; save(); render(); break; }
    case 'ddel': if (confirm(`Törlöd a(z) „${S.plan.days[i].name}” napot a gyakorlataival együtt?`)) { delete S.cur[S.plan.days[i].id]; S.plan.days.splice(i, 1); save(); render(); } break;
    case 'dnew': { const n = S.plan.days.length; S.plan.days.push({ id: newId(), tab: String.fromCharCode(65 + n), name: String.fromCharCode(65 + n) + ' nap', sub: '', ex: [] }); save(); render(); break; }
    case 'export': {
      const blob = new Blob([JSON.stringify({ app: 'edzesnaplo', v: 1, plan: S.plan, settings: S.settings, sessions: S.sessions }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'edzesnaplo-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      break;
    }
    case 'reset': { const k = $('tplsel').value; if (confirm(`Betöltöd: ${PLANS[k].name}? A mostani terved lecserélődik. A napló megmarad, és az azonos nevű gyakorlatok a legutóbbi súlyodat és az előzményeidet viszik tovább.`)) { S.plan = adoptPlan(clone(PLANS[k].plan), S.plan); S.cur = {}; S.tab = S.lastDay = S.plan.days[0].id; save(); render(); window.scrollTo(0, 0); toast('Terv betöltve'); } break; }
    case 'admuser': ADM = { uid: b.dataset.uid, view: 'log', data: null }; render(); loadAdm(); break;
    case 'demo': { const n = genDemo(); save(); render(); toast(n + ' teszt edzés hozzáadva'); break; }
    case 'demodel': { const del = S.sessions.filter((x) => x.demo); S.sessions = S.sessions.filter((x) => !x.demo); if (Gym.cloud) for (const x of del) Gym.cloud.delSession(x.id).catch(console.warn); save(); render(); toast('Teszt edzések törölve'); break; }
    case 'hardreload': (async () => { try { const rs = await navigator.serviceWorker.getRegistrations(); for (const r of rs) await r.update(); const ks = await caches.keys(); for (const k of ks) await caches.delete(k); } catch (x) {} location.reload(); })(); break;
    case 'passadd': {
      // hosszabbítás a mostani lejárattól (ha már lejárt, mától)
      const pi = passInfo(), base = pi && pi.n >= 0 ? pi.end : new Date(); const d = new Date(base); d.setMonth(d.getMonth() + +b.dataset.m);
      S.settings.pass = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      save(); render(); toast('Bérlet érvényes: ' + S.settings.pass.replace(/-/g, '.') + '.'); break;
    }
    case 'passdel': S.settings.pass = ''; save(); render(); break;
    case 'admback': ADM = null; render(); break;
    case 'admview': ADM.view = b.dataset.v; render(); break;
  }
});
$('main').addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'chartsel') { chartEx = t.value; render(); return; }
  if (t.id === 'pass') { S.settings.pass = t.value || ''; save(); render(); return; }
  if (t.id === 'donelast') { S.settings.doneLast = t.checked; save(); return; }
  if (t.id === 'soundon') { S.settings.sound = t.checked; save(); return; }
  if (t.id === 'ytext') { S.settings.ytExt = t.checked; save(); return; }
  if (t.id === 'autoorder') { S.settings.autoOrder = t.checked; save(); return; }
  if (t.id === 'goal') { S.settings.goal = Math.max(1, Math.min(7, +t.value || 3)); save(); return; }
  if (t.id === 'bw') { setBW(fromU(t.value)); save(); render(); return; }
  if (t.id === 'defrest') { S.settings.rest = Math.max(0, +t.value || 0); save(); return; }
  if (t.id === 'importfile') { importFile(t.files[0]); return; }
  const dd = t.closest('[data-day]');
  if (dd && t.dataset.k) { S.plan.days[+dd.dataset.day][t.dataset.k] = t.value.trim(); save(); render(); return; }
  const row = t.closest('.set');
  if (row) {
    const day = dayById(S.tab), ex = dayEx(day).find((x) => x.id === t.closest('[data-ex]').dataset.ex);
    const s = curSet(day, ex, +row.dataset.i);
    if (t.classList.contains('w')) {
      s.w = fromU(t.value, exU(ex));
      if (isBW(ex) && !s.wu && setBW(s.w)) { save(); render(); toast('Testsúly frissítve mindenhol'); return; }
    } else s.r = t.value === '' ? null : +t.value;
    save();
  }
});
function importFile(f) {
  if (!f) return;
  f.text().then((txt) => {
    const d = JSON.parse(txt);
    if (!d || !d.plan || !Array.isArray(d.plan.days)) throw new Error('nem edzésnapló fájl');
    if (!confirm('Betöltöd a fájlt? A terv lecserélődik, a napló bejegyzései hozzáadódnak a meglévőkhöz.')) return;
    S.plan = upgradePlan(d.plan); if (d.settings) S.settings = Object.assign(S.settings, d.settings);
    const have = new Set(S.sessions.map((s) => s.id));
    for (const s of d.sessions || []) if (!have.has(s.id)) { S.sessions.push(s); if (Gym.cloud) Gym.cloud.addSession(clone(s)).catch(console.warn); }
    S.sessions.sort((a, b) => b.date - a.date);
    save(); render(); toast('Betöltve');
  }).catch((e) => alert('A fájl nem tölthető be: ' + e.message));
}

// gyakorlattár: kereső (ékezet nélkül is) + kategória-szűrő
const fold = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
let libCat = 'Mind', libSel = -1;
function fillLib() {
  const cats = ['Mind'].concat([...new Set(LIBRARY.map((l) => l.cat))]);
  $('libcats').innerHTML = cats.map((c) => `<button type="button" data-cat="${esc(c)}" class="${c === libCat ? 'on' : ''}">${esc(c)}</button>`).join('');
  const q = fold($('libq').value).split(/\s+/).filter(Boolean);
  const all = LIBRARY.map((l, i) => [l, i]).filter(([l]) => q.every((w) => fold(l.name + ' ' + l.q + ' ' + l.cat).includes(w)));
  let hits = all.filter(([l]) => libCat === 'Mind' || l.cat === libCat);
  if (!hits.length && q.length) hits = all; // ha a kategóriában nincs, keressen mindenhol
  $('libres').innerHTML = hits.map(([l, i]) => `<button type="button" data-li="${i}" class="${i === libSel ? 'on' : ''}">${esc(l.name)}<span>${esc(l.cat)}</span></button>`).join('')
    + (hits.length ? '' : `<div class="none">Nincs ilyen a gyakorlattárban. Írd be lent a nevét saját gyakorlatként.</div>`);
}
$('libq').addEventListener('input', fillLib);
document.addEventListener('input', (e) => { if (e.target.id === 'logq') { logQ = e.target.value; if ($('loglist') && LOGX) $('loglist').innerHTML = logList(LOGX); } });
$('libcats').addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) { libCat = b.dataset.cat; fillLib(); } });
$('libres').addEventListener('click', (e) => {
  const b = e.target.closest('[data-li]'); if (!b) return;
  const l = LIBRARY[+b.dataset.li], f = $('exform'); libSel = +b.dataset.li;
  f.name.value = l.name; f.sets.value = l.sets; f.reps.value = l.reps; f.rest.value = l.rest;
  f.unit.value = l.unit || ''; f.w.value = l.w == null ? '' : toU(l.w, l.unit || S.settings.unit); f.pair.checked = !!l.pair; f.side.checked = !!l.side; f.assist.checked = ASSIST_RE.test(l.name); f.video.value = l.video; f.note.value = l.note || '';
  f.dataset.q = l.q; fillLib();
});

// gyakorlat szerkesztése
let exCtx = null;
function openEx(day, i) {
  exCtx = { day, i }; $('exform').classList.remove('logm'); $('exdlg-r').textContent = 'Ismétlés (pl. 8–10)';
  const ex = i >= 0 ? day.ex[i] : { name: '', sets: 3, reps: '10', w: null, rest: S.settings.rest, video: '', note: '' };
  const f = $('exform');
  f.name.value = ex.name; f.sets.value = ex.sets; f.reps.value = ex.reps;
  f.unit.value = ex.unit || ''; f.wu.value = ex.wu || 0; f.w.value = ex.w == null ? '' : toU(ex.w, exU(ex)); f.rest.value = ex.rest == null ? '' : ex.rest;
  f.pair.checked = !!ex.pair; f.side.checked = !!ex.side; f.assist.checked = !!ex.assist; f.video.value = ex.video || ''; f.note.value = ex.note || '';
  $('exdlg-title').textContent = i >= 0 ? 'Gyakorlat módosítása' : 'Új gyakorlat';
  $('exdlg-w').textContent = 'Súly (a választott mértékegységben), üresen: testsúly';
  $('exdel').hidden = i < 0;
  $('libpick').hidden = i >= 0; delete f.dataset.q;
  if (i < 0) { $('libq').value = ''; libCat = 'Mind'; libSel = -1; fillLib(); }
  $('exdlg').showModal();
  if (i < 0) setTimeout(() => $('libq').focus(), 50);
}
// utólagos gyakorlat egy már lezárt edzéshez
function openLogAdd(sid) {
  exCtx = { log: sid };
  const f = $('exform'); f.classList.add('logm');
  f.name.value = ''; f.sets.value = 3; f.reps.value = '10'; f.unit.value = ''; f.w.value = ''; f.pair.checked = false; f.side.checked = false;
  f.wu.value = 0; f.rest.value = ''; f.video.value = ''; f.note.value = '';
  $('exdlg-title').textContent = 'Gyakorlat hozzáadása ehhez az edzéshez';
  $('exdlg-w').textContent = 'Súly (a választott mértékegységben), üresen: testsúly';
  $('exdlg-r').textContent = 'Ismétlés (pl. 10, vagy soronként: 10,10,8)';
  $('exdel').hidden = true; $('libpick').hidden = false; delete f.dataset.q;
  $('libq').value = ''; libCat = 'Mind'; libSel = -1; fillLib();
  $('exdlg').showModal(); setTimeout(() => $('libq').focus(), 50);
}
function saveLogAdd(sid) {
  exCtx = null;
  const sess = S.sessions.find((x) => x.id === sid); if (!sess) return;
  const f = $('exform'), name = f.name.value.trim(); if (!name) return;
  const u = f.unit.value || unit(), w = fromU(f.w.value, u), n = Math.max(1, Math.min(20, +f.sets.value || 1));
  const rs = f.reps.value.split(/[,;\s]+/).map((t) => parseInt(t, 10)).filter((x) => !isNaN(x));
  const sets = []; for (let k = 0; k < n; k++) sets.push({ w: w == null ? (S.settings.bw || null) : w, r: rs.length ? rs[Math.min(k, rs.length - 1)] : null });
  let pe = null; for (const d of S.plan.days) for (const ex of d.ex) if (!pe && ex.name.toLowerCase() === name.toLowerCase()) pe = ex;
  sess.items.push({ ex: pe ? pe.id : 'x' + newId(), name, pair: f.pair.checked, side: f.side.checked, bw: w == null, u, sets, late: 1 });
  { const kg = S.settings.bw; const k = kg && sess.t0 ? estKcal(sess, kg) : null; if (k != null) { sess.kcal = k; sess.kcalNet = Math.max(0, k - restBurn(sess.t0, sess.date, kg)); } }
  save(); if (Gym.cloud) Gym.cloud.addSession(clone(sess)).catch(console.warn);
  render(); toast('Hozzáadva: ' + name);
}
$('exdlg').addEventListener('close', () => {
  if ($('exdlg').returnValue !== 'ok' || !exCtx) return;
  if (exCtx.log) return saveLogAdd(exCtx.log);
  const f = $('exform'), { day, i } = exCtx;
  const ex = i >= 0 ? day.ex[i] : { id: newId() };
  const oldW = ex.w;
  Object.assign(ex, {
    name: f.name.value.trim(), sets: Math.max(1, +f.sets.value || 1), reps: f.reps.value.trim(),
    wu: Math.max(0, Math.min(5, +f.wu.value || 0)), unit: f.unit.value, w: fromU(f.w.value, f.unit.value || unit()), rest: f.rest.value === '' ? null : Math.max(0, +f.rest.value),
    pair: f.pair.checked, side: f.side.checked, assist: f.assist.checked || undefined, video: f.video.value.trim(), note: f.note.value.trim(), q: f.dataset.q || ex.q || ''
  });
  if (!ex.video) ex.video = vidFor(ex);
  if (ex.w !== oldW) { ex.up = false; ex.bump = 0; }
  if (i < 0) { day.ex.push(ex); setTimeout(() => { const el = document.querySelector(`[data-ex="${ex.id}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Hozzáadva: ' + ex.name); }, 100); }
  save(); render();
});
$('exdel').onclick = () => {
  const { day, i } = exCtx;
  if (!confirm(`Törlöd: ${day.ex[i].name}?`)) return;
  day.ex.splice(i, 1); exCtx = null; $('exdlg').close(); save(); render();
};

{ const sd = suggestDay(); if (sd) S.tab = S.lastDay = sd; }
render();

// a weboldalon: telepíthető app (service worker) és bejelentkezés
const onSite = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
// új verzió figyelése: a version.json-t mindig a szerverről kérjük, és ha újabb, frissítünk
async function checkVersion() {
  try {
    const v = (await (await fetch('version.json', { cache: 'no-store' })).json()).v;
    if (!v || v === APPVER) return;
    if (sessionStorage.getItem('edzesnaplo.upd') === v) return; // egyszer próbáljuk
    if (Object.values(S.cur).some(started)) { toast('Új verzió érhető el – edzés után betöltődik'); return; }
    sessionStorage.setItem('edzesnaplo.upd', v);
    try { const ks = await caches.keys(); for (const k of ks) await caches.delete(k); const rs = await navigator.serviceWorker.getRegistrations(); for (const r of rs) await r.update(); } catch (e) {}
    location.reload();
  } catch (e) {}
}
if (onSite) { checkVersion(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); }); }
if (onSite && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
  }).catch((e) => console.warn(e));
  // új verzió érkezett: egyszer újratöltjük (edzés közben nem, hogy ne zavarjon)
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return; reloaded = true;
    const busy = Object.values(S.cur).some(started);
    if (busy) toast('Új verzió elérhető – a következő megnyitáskor betöltődik'); else location.reload();
  });
}
if (onSite) { window.GYM_AUTH = true; import('./auth.js').catch((e) => { console.warn('Bejelentkezés nem érhető el', e); window.GYM_AUTH = false; }); }
</script>
